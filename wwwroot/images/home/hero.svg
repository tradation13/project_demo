<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hand mobility recovery progress chart</title>
<desc>Line chart with numeric percentage and date labels showing mobility scores rising and falling across ten sessions, trending upward overall.</desc>

<defs>
  <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16A34A" stop-opacity="0.28"/>
    <stop offset="55%" stop-color="#22C55E" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="lineStroke" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#0F7A3D"/>
    <stop offset="55%" stop-color="#22B15A"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>

  <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- baseline -->
<line x1="40" y1="350" x2="640" y2="350" stroke="#0F7A3D" stroke-opacity="0.18" stroke-width="1.5"/>

<!-- trend guide -->
<line x1="50" y1="312" x2="630" y2="88" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.9"/>

<!-- area under curve -->
<path d="M 50 317.7
  C 60.75 311.55, 93.02 283.5, 114.5 280.8
  C 135.98 278.1, 157.42 307.27, 178.9 301.5
  C 200.38 295.73, 221.92 252.73, 243.4 246.2
  C 264.88 239.67, 286.33 270.0, 307.8 262.3
  C 329.27 254.6, 350.72 207.68, 372.2 200
  C 393.68 192.32, 415.22 224.28, 436.7 216.2
  C 458.18 208.12, 479.62 159.58, 501.1 151.5
  C 522.58 143.42, 544.12 176.92, 565.6 167.7
  C 587.08 158.48, 619.27 108.12, 630 96.2
  L 630 350 L 50 350 Z" fill="url(#areaFill)"/>

<!-- line -->
<path d="M 50 317.7
  C 60.75 311.55, 93.02 283.5, 114.5 280.8
  C 135.98 278.1, 157.42 307.27, 178.9 301.5
  C 200.38 295.73, 221.92 252.73, 243.4 246.2
  C 264.88 239.67, 286.33 270.0, 307.8 262.3
  C 329.27 254.6, 350.72 207.68, 372.2 200
  C 393.68 192.32, 415.22 224.28, 436.7 216.2
  C 458.18 208.12, 479.62 159.58, 501.1 151.5
  C 522.58 143.42, 544.12 176.92, 565.6 167.7
  C 587.08 158.48, 619.27 108.12, 630 96.2"
  fill="none" stroke="url(#lineStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)" opacity="0.95"/>

<!-- data points -->
<g fill="#FFFFFF" stroke="#16A34A" stroke-width="2.25">
  <circle cx="50" cy="317.7" r="4.5"/>
  <circle cx="114.5" cy="280.8" r="4.5"/>
  <circle cx="178.9" cy="301.5" r="4.5"/>
  <circle cx="243.4" cy="246.2" r="4.5"/>
  <circle cx="307.8" cy="262.3" r="4.5"/>
  <circle cx="372.2" cy="200" r="4.5"/>
  <circle cx="436.7" cy="216.2" r="4.5"/>
  <circle cx="501.1" cy="151.5" r="4.5" stroke="#22B15A"/>
  <circle cx="565.6" cy="167.7" r="4.5" stroke="#22B15A"/>
</g>

<!-- milestone point -->
<circle cx="630" cy="96.2" r="24" fill="url(#haloGlow)"/>
<circle cx="630" cy="96.2" r="8.5" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/>
<circle cx="630" cy="96.2" r="4" fill="#22C55E"/>

<!-- percentage values -->
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#0B5C2C" text-anchor="middle">
  <text x="50" y="335">11%</text>
  <text x="114.5" y="266">23%</text>
  <text x="178.9" y="319">16%</text>
  <text x="243.4" y="232">35%</text>
  <text x="307.8" y="280">29%</text>
  <text x="372.2" y="186">50%</text>
  <text x="436.7" y="234">45%</text>
  <text x="501.1" y="137">66%</text>
  <text x="565.6" y="186">61%</text>
  <text x="630" y="70" font-size="14">85%</text>
</g>

<!-- date labels -->
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#4B7A5C" text-anchor="middle">
  <text x="50" y="368">5/1</text>
  <text x="114.5" y="368">12/1</text>
  <text x="178.9" y="368">19/1</text>
  <text x="243.4" y="368">26/1</text>
  <text x="307.8" y="368">2/2</text>
  <text x="372.2" y="368">9/2</text>
  <text x="436.7" y="368">16/2</text>
  <text x="501.1" y="368">23/2</text>
  <text x="565.6" y="368">2/3</text>
  <text x="630" y="368">9/3</text>
</g>

</svg>
